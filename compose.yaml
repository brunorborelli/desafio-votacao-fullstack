services:
  banco-de-dados:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: votacao
      POSTGRES_USER: votacao
      POSTGRES_PASSWORD: votacao
    ports:
      - "5432:5432"
    volumes:
      - dados_postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U votacao -d votacao"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      URL_BANCO: jdbc:postgresql://banco-de-dados:5432/votacao
      USUARIO_BANCO: votacao
      SENHA_BANCO: votacao
    ports:
      - "8080:8080"
    depends_on:
      banco-de-dados:
        condition: service_healthy

  teste-desempenho:
    image: grafana/k6:latest
    profiles:
      - desempenho
    environment:
      URL_BASE: http://backend:8080
      QUANTIDADE_VOTOS: ${QUANTIDADE_VOTOS:-5000}
      USUARIOS_VIRTUAIS: ${USUARIOS_VIRTUAIS:-50}
      MAXIMO_TENTATIVAS_AUTORIZACAO: ${MAXIMO_TENTATIVAS_AUTORIZACAO:-20}
      DURACAO_MAXIMA: ${DURACAO_MAXIMA:-30m}
    volumes:
      - ./desempenho:/scripts:ro
    command: run /scripts/teste-votacao.js
    depends_on:
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  dados_postgresql: